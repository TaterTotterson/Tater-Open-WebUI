name: tater-open-webui

services:
  tater-open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: tater-open-webui:dev
    container_name: tater-open-webui
    volumes:
      - tater-open-webui:/app/backend/data
      - '${TATER_WEBUI_HOST_WORKSPACE-.}:/workspace'
    ports:
      - ${TATER_WEBUI_PORT-3000}:8080
    environment:
      - 'TATER_API_BASE_URL=${TATER_API_BASE_URL-http://host.docker.internal:8501/v1}'
      - 'TATER_API_KEY=${TATER_API_KEY-}'
      - 'TATER_BASE_MODEL=${TATER_BASE_MODEL-tater/base}'
      - 'TATER_HYDRA_MODEL=${TATER_HYDRA_MODEL-tater/hydra}'
      - 'TATER_HYDRA_TIMEOUT_SECONDS=${TATER_HYDRA_TIMEOUT_SECONDS-600}'
      - 'TATER_AGENT_MAX_ITERATIONS=${TATER_AGENT_MAX_ITERATIONS-32}'
      - 'TATER_WEBUI_WORKSPACE=/workspace'
      - 'WEBUI_NAME=Tater Open WebUI'
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY-}'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  tater-open-webui: {}
