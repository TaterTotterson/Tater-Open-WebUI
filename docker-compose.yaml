name: tater-open-webui

services:
  tater-open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: tater-open-webui:dev
    container_name: tater-open-webui
    volumes:
      - tater-open-webui:/app/backend/data
      - '${TATER_WEBUI_HOST_PROJECTS-./projects}:/projects'
    ports:
      - ${TATER_WEBUI_PORT-3000}:8080
    environment:
      - 'TATER_API_BASE_URL=${TATER_API_BASE_URL-http://host.docker.internal:8501/v1}'
      - 'TATER_API_KEY=${TATER_API_KEY-}'
      - 'TATER_BASE_MODEL=${TATER_BASE_MODEL-tater/base}'
      - 'TATER_HYDRA_MODEL=${TATER_HYDRA_MODEL-tater/hydra}'
      - 'TATER_CONTEXT_WINDOW=${TATER_CONTEXT_WINDOW-32768}'
      - 'TATER_HYDRA_TIMEOUT_SECONDS=${TATER_HYDRA_TIMEOUT_SECONDS-600}'
      - 'TATER_AGENT_MAX_ITERATIONS=${TATER_AGENT_MAX_ITERATIONS-32}'
      - 'ENABLE_TATER_FILE_LOG=${ENABLE_TATER_FILE_LOG-true}'
      - 'ENABLE_TATER_RUN_LEDGER=${ENABLE_TATER_RUN_LEDGER-true}'
      - 'TATER_RUN_LEDGER_MAX_BYTES=${TATER_RUN_LEDGER_MAX_BYTES-52428800}'
      - 'TATER_RUN_LEDGER_BACKUP_COUNT=${TATER_RUN_LEDGER_BACKUP_COUNT-10}'
      - 'TATER_RUN_LEDGER_MAX_FIELD_CHARS=${TATER_RUN_LEDGER_MAX_FIELD_CHARS-200000}'
      - 'TATER_PROJECTS_ROOT=/projects'
      - 'TATER_WEBUI_WORKSPACE=/projects'
      - 'WEBUI_NAME=Tater Open WebUI'
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY-}'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  tater-open-webui: {}
