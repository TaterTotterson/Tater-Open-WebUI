services:
  tater-chat:
    build:
      context: .
      dockerfile: Dockerfile
    image: tater-chat:dev
    container_name: tater-chat
    volumes:
      - tater-chat:/app/backend/data
      - '${TATERCHAT_HOST_WORKSPACE-.}:/workspace'
    ports:
      - ${TATER_CHAT_PORT-3000}:8080
    environment:
      - 'TATER_API_BASE_URL=${TATER_API_BASE_URL-http://host.docker.internal:8501/v1}'
      - 'TATER_API_KEY=${TATER_API_KEY-}'
      - 'TATER_BASE_MODEL=${TATER_BASE_MODEL-tater/base}'
      - 'TATER_HYDRA_MODEL=${TATER_HYDRA_MODEL-tater/hydra}'
      - 'TATER_HYDRA_TIMEOUT_SECONDS=${TATER_HYDRA_TIMEOUT_SECONDS-600}'
      - 'TATER_AGENT_MAX_ITERATIONS=${TATER_AGENT_MAX_ITERATIONS-32}'
      - 'TATERCHAT_WORKSPACE=/workspace'
      - 'WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY-}'
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

volumes:
  tater-chat: {}
