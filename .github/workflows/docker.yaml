name: Build and publish TaterChat

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: taterchat-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  image:
    name: Linux amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf \
            /opt/hostedtoolcache \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc
          df -h /

      - name: Set image name
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          platforms: linux/amd64
          tags: taterchat-ci:${{ github.sha }}
          build-args: |
            BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test backend inside image
        env:
          IMAGE: taterchat-ci:${{ github.sha }}
        run: |
          docker run --rm --entrypoint python "$IMAGE" \
            -m unittest discover -s /app/backend/tests -p 'test_*.py'
          docker run --rm --entrypoint python "$IMAGE" \
            -m compileall -q /app/backend/open_webui

      - name: Smoke-test container health
        env:
          IMAGE: taterchat-ci:${{ github.sha }}
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --rm \
            --name taterchat-smoke \
            --publish 127.0.0.1:8080:8080 \
            --env WEBUI_SECRET_KEY=ci-smoke-test-secret \
            --env TATER_API_BASE_URL=http://127.0.0.1:9/v1 \
            "$IMAGE")
          cleanup() {
            docker logs "$container_id" || true
            docker stop "$container_id" || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/health \
              | python -c 'import json,sys; assert json.load(sys.stdin).get("status") is True'; then
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_id")" != true ]; then
              echo 'TaterChat container stopped before becoming healthy.' >&2
              exit 1
            fi
            sleep 2
          done

          echo 'TaterChat did not become healthy within 120 seconds.' >&2
          exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        if: github.event_name != 'pull_request'
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=TaterChat
            org.opencontainers.image.description=Terminal-first Tater chat interface

      - name: Publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
